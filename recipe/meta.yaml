{% set name = "spyder-terminal" %}
{% set import = "spyder_terminal" %}
{% set version = "1.3.1" %}
{% set sha256 = "04f7d93c1b7c4c1f6a328cd8bb63ff7af2fac4d973b513c0f8ca3c3553411127" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0]|lower }}/{{ name|lower }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools

  run:
    - python >={{ python_min }}
    - spyder >=6.1.0,<6.2.0
    - tornado
    - terminado >=0.13.1
    - coloredlogs
    - requests

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  # Importing spyder_terminal requires many CDTs to be installed on linux
  # This would needlessly increase build time
  # imports:
  #   - {{ import }}

about:
  home: https://www.spyder-ide.org
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Spyder plugin for displaying system terminals.
  description: |
    This plugin allows you to execute flawlessly any Bash command
    inside Spyder, even ncurses applications like nano or vi, or
    Windows console applications such as PowerShell.
  dev_url: https://github.com/spyder-ide/spyder-terminal
  doc_url: https://github.com/spyder-ide/spyder-terminal/blob/master/README.rst

extra:
  recipe-maintainers:
    - CAM-Gerlach
    - ccordoba12
    - dalthviz
